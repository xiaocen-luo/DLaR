# Contrastive Length Optimization Configuration (Idea 3)
reward:
  answer_reward: 1.0
  format_penalty: -1.0
  contrastive_coefficient: 1.0
  top_k_short: 2
  length_ratio_threshold: 1.2
  temperature: 0.1

#use_relative_length_reward: true
#
## Reward configuration (used with --use_relative_length_reward flag)
#reward:
#  # Basic rewards
#  answer_reward: 1.0      # Reward for correct answer
