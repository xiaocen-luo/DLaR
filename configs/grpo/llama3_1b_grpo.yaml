#
#  # Distributed settings
#  all_gather: false  # Whether to gather across devices for length calculation

eval:
  do_eval: false
  eval_strategy: "no"
  eval_steps: 5
  per_device_eval_batch_size: 8
  eval_accumulation_steps: 8
  eval_on_start: false

output:
  base_dir: "./outputs"
